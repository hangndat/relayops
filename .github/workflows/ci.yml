name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relayops
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        env:
          RELAYOPS_DB_URL: jdbc:postgresql://127.0.0.1:5432/relayops
          RELAYOPS_DB_USER: relayops
          RELAYOPS_DB_PASSWORD: relayops
        run: |
          ./mvnw -B test \
            -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/relayops \
            -Dspring.datasource.username=relayops \
            -Dspring.datasource.password=relayops

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
